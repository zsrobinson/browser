# browser — a signed-in Chromium on the NAS that Claude can drive
# and Zach can watch at https://browser.zsrobinson.com
#
# Two containers. Nothing publishes a host port: everything reaches the
# outside world through the Cloudflare Tunnel, behind Cloudflare Access.
# Sized for a 2GB Synology (~1.5GB worst case).

name: browser

services:
  # Chromium + web viewer (port 3000) + Playwright MCP (port 8931).
  # The profile (cookies, logins) lives in ./data and survives restarts.
  browser:
    build:
      context: ./image       # needs the image/ folder from the repo next to this file
      args:
        BASE_IMAGE: ${BASE_IMAGE:-ghcr.io/linuxserver/chromium:latest}
    image: browser:local
    pull_policy: build       # local image; don't try to pull it from a registry
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - MCP_HOSTNAME=${MCP_HOSTNAME}
      - RESTART_APP=true       # relaunch Chromium if its window gets closed
      # X11 instead of the newer Wayland mode: Wayland waits for a compositor
      # socket that never appears on a GPU-less NAS, so Chromium never starts.
      - PIXELFLUX_WAYLAND=false
      # Viewer tuned for a GPU-less NAS over a tunnel. JPEG is the lightest
      # software encoder for mostly-still web pages and every browser decodes
      # it (H.264 via WebCodecs is shaky in Firefox). Fixed 1280x800 desktop,
      # 15 fps to start, capped at 30. All adjustable in the viewer sidebar.
      - SELKIES_ENCODER=jpeg
      - SELKIES_FRAMERATE=15,8-30
      - SELKIES_MANUAL_WIDTH=1280
      - SELKIES_MANUAL_HEIGHT=800
      # Unquoted on purpose: quotes in list-form env become part of the value
      # and Chromium silently ignores the flags.
      - CHROME_CLI=--remote-debugging-port=9222 --user-data-dir=/config/agent-profile --no-first-run --no-default-browser-check --disable-features=Translate,MediaRouter --renderer-process-limit=3 --disable-backgrounding-occluded-windows --disable-renderer-backgrounding --disable-background-timer-throttling about:blank
    volumes:
      - ./data:/config
    shm_size: "1gb"            # Docker's 64MB default crashes Chromium on real pages
    mem_limit: 1400m           # restart the browser rather than starve the NAS
    restart: unless-stopped

  # Cloudflare Tunnel. Routes (set in the Cloudflare dashboard):
  #   browser.zsrobinson.com      -> http://browser:3000   (viewer)
  #   browsermcp.zsrobinson.com   -> http://browser:8931   (Claude connector)
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    mem_limit: 96m
    depends_on:
      - browser
    restart: unless-stopped
